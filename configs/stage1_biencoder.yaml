model:
  antigen_dim: 1280       # ESM-2 650M representation
  antibody_dim: 512       # AntiBERTy representation
  hidden_dim: 256
  projection_dim: 128     # Vector database index dimension
  num_conv_layers: 2
  kernel_size: 5
  dropout: 0.1
  antibody_pooling: "cdr_attention"
  antigen_pooling: "attention"
  init_temperature: 0.07
  learnable_temperature: true

training:
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.01
  epochs: 20
  grad_clip_norm: 1.0
  device: "cuda"

