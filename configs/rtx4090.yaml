model:
  antigen_dim: 1280
  antibody_dim: 512
  hidden_dim: 1024
  projection_dim: 512
  num_conv_layers: 2
  kernel_size: 5
  dropout: 0.1
  antibody_pooling: residual_gate
  antigen_pooling: residual_gate
  init_temperature: 0.2
  learnable_temperature: true
training:
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.2
  epochs: 100
  warmup_steps: 200
  grad_clip_norm: 1.0
  device: cuda
data:
  dataset_csv: data/calm_dataset.csv
  embedding_dir: artifacts/embeddings
  num_workers: 4
  pin_memory: true
