model:
  antigen_dim: 1280       # ESM-2 650M
  antibody_dim: 512       # AntiBERTy
  hidden_dim: 512         # Scaled up for 4090 24GB capacity
  projection_dim: 256     # High-resolution vector index
  num_conv_layers: 2
  kernel_size: 5
  dropout: 0.1
  antibody_pooling: "cdr_attention"
  antigen_pooling: "attention"
  init_temperature: 0.07
  learnable_temperature: true

training:
  batch_size: 256         # Large batch size for robust contrastive negative sampling on 4090
  learning_rate: 0.001
  weight_decay: 0.05
  epochs: 50
  warmup_steps: 200
  grad_clip_norm: 1.0
  device: "cuda"

data:
  dataset_csv: "data/calm_dataset.csv"
  embedding_dir: "artifacts/embeddings"
  num_workers: 8
  pin_memory: true

