[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon"
version = "0.1.0"
description = "BEACON: Bi-Encoder Antibody-antigen Contrastive Orientation Network for High-Throughput Epitope Screening"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.5.0",
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scikit-learn>=1.3,<2",
    "scipy>=1.10",
    "matplotlib>=3.7,<4",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "biopython>=1.81",
    "transformers>=4.40.0",
    "fair-esm>=2.0.0",
    "antiberty>=0.1.3",
]

[tool.setuptools.packages.find]
include = ["beacon*", "aalite*"]

[tool.uv]
package = true
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
